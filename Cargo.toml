[package]
name = "mpvrun2"
version = "0.1.0"
edition = "2021"

[dependencies]
anstream = "0.6.18"
anyhow = "1.0.93"
clap = { version = "4.5.20", features = ["derive"] }
inquire = "0.7.5"
once_cell = "1.21.3"
open = "5.3.3"
pyo3 = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.132"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
